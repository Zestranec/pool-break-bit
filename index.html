<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Pool Break Bet</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        min-height: 100%;
        background: #0d0d0d;
        overflow-x: hidden;
        overflow-y: auto;
        touch-action: pan-y;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        font-family: sans-serif;
      }
      #game-container {
        position: relative;
        width: 100%;
        max-width: 430px;
        min-height: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
